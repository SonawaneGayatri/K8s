#akms
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: batch-june-replicaset
  labels:
    batch: june-2026
spec:
  replicas: 5
  selector:
    matchLabels: 
      batch: june-2026
  template:
    metadata:
      labels:
        batch: june-2026
    spec:
       containers:
       - name: nginx-webserver
         image: nginx
         ports:
          - containerPort: 80
