apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-june-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      batch: june-2026
  template:
      metadata:
        labels:
          batch: june-2026
      spec:
        containers:
          - name: nginx-webserver
            image: nginx
            ports:
              - containerPort: 80
